[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-rollup-blob-packer"
version = "0.1.0"
description = "Pack indivisible payloads into bounded data containers using deterministic first-fit decreasing and report unused capacity."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-rollup-blob-packer = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
